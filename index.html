<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ALNS - ULTIMATE CORE V13.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { game: { base: '#020617', card: '#0f172a', accent: '#8b5cf6', cyan: '#06b6d4', danger: '#ef4444', success: '#22c55e', warning: '#f59e0b' } } } }
        }
    </script>
    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; user-select: none; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(139, 92, 246, 0.2); }
        .btn-press:active { transform: scale(0.96); opacity: 0.8; }
        .blitz-step { display: none; }
        .blitz-step.active { display: block !important; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .dash-card { min-height: 90px; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 1.25rem; border-radius: 1.5rem; border-left-width: 8px; transition: all 0.2s; position: relative; overflow: hidden; }
        .tool-header { display: flex; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 1px solid #1e293b; margin-bottom: 20px; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

    <!-- LOGIN HUD -->
    <div id="view-login" class="fixed inset-0 z-[1000] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-10 rounded-[3rem] max-w-md w-full text-center space-y-6 border-t-8 border-game-accent shadow-2xl">
            <h1 class="text-3xl font-black italic uppercase text-white">ALNS V13.2</h1>
            <form onsubmit="realizarLogin(event)" class="space-y-4">
                <input type="password" id="login-senha" placeholder="SENHA" required class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl outline-none text-center font-black focus:border-game-cyan uppercase text-white shadow-inner text-lg">
                <button type="submit" class="w-full bg-game-accent text-white p-4 rounded-2xl font-black uppercase btn-press">CONECTAR</button>
            </form>
        </div>
    </div>

    <!-- HUD SUPERIOR -->
    <header class="glass sticky top-0 z-50 px-4 py-3 flex items-center justify-between border-b border-game-accent/30 shadow-xl">
        <div class="flex items-center gap-3" onclick="voltarParaBase()">
            <div class="w-10 h-10 border-2 border-game-accent rounded-lg flex items-center justify-center text-game-accent font-black">AL</div>
            <div>
                <h2 class="text-xs font-black uppercase text-game-cyan">A.L.N.S.</h2>
                <span id="cloud-status" class="text-[7px] font-bold text-slate-500 uppercase italic">Nuvem Sincronizada</span>
            </div>
        </div>
        <div class="flex gap-2">
             <button onclick="atualizarDashboard(); showToast('SYNCING...')" class="p-2 bg-slate-800/50 text-game-cyan rounded-xl border border-slate-700 btn-press"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
             <button onclick="realizarLogout()" class="p-2 bg-slate-800/50 text-game-danger rounded-xl border border-slate-700 btn-press"><i data-lucide="power" class="w-4 h-4"></i></button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
        
        <!-- DASHBOARD -->
        <section id="view-dashboard" class="space-y-4 animate-fadeIn">
            <!-- ALERTA DE RASCUNHO EM NUVEM -->
            <div id="cloud-draft-alert" class="hidden glass border-l-4 border-game-warning p-4 rounded-2xl flex justify-between items-center animate-pulse">
                <div class="flex items-center gap-3">
                    <i data-lucide="cloud-download" class="text-game-warning"></i>
                    <p class="text-[10px] font-black uppercase text-game-warning">Blitz pendente na Nuvem: <span id="cloud-draft-name"></span></p>
                </div>
                <button onclick="resgatarBlitzNuvem()" class="text-[10px] font-black bg-game-warning text-slate-950 px-3 py-1 rounded-lg">ABRIR</button>
            </div>

            <div class="grid grid-cols-1 gap-3">
                <button onclick="navigate('blitz-flow')" class="dash-card glass border-l-game-success text-white btn-press">
                    <div class="text-left"><span class="text-[9px] font-black text-slate-500 uppercase">Campo</span><h2 class="text-lg font-black text-game-success uppercase italic">Operação Blitz</h2></div>
                    <i data-lucide="zap" class="text-game-success"></i>
                </button>
                <button onclick="navigate('consulta')" class="dash-card glass border-l-game-cyan text-white btn-press">
                    <div class="text-left"><span class="text-[9px] font-black text-slate-500 uppercase">Dados</span><h2 class="text-lg font-black text-game-cyan uppercase italic">Matrix de Estoque</h2></div>
                    <i data-lucide="database" class="text-game-cyan"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mt-4">
                <div onclick="navigate('consulta')" class="glass p-5 rounded-3xl border border-slate-800 text-center">
                    <p class="text-[9px] font-black text-slate-500 uppercase">Cadastrados</p>
                    <h3 id="dash-total" class="text-3xl font-black text-white">0</h3>
                </div>
                <div onclick="abrirFiltroCritico()" class="glass p-5 rounded-3xl border border-slate-800 text-center">
                    <p class="text-[9px] font-black text-game-danger uppercase">Vencendo (7D)</p>
                    <h3 id="dash-vencidos" class="text-3xl font-black text-game-danger">0</h3>
                </div>
            </div>
        </section>

        <!-- BLITZ FLOW -->
        <section id="view-blitz-flow" class="hidden max-w-xl mx-auto space-y-4 animate-fadeIn text-white font-black">
            <!-- Step 0: EAN -->
            <div id="blitz-step-0" class="blitz-step active glass p-8 rounded-[2rem] border-t-8 border-game-success text-center space-y-6">
                <div class="tool-header border-0 mb-0 pb-0">
                    <button onclick="voltarParaBase()" class="p-2.5 bg-slate-800 rounded-xl text-game-success"><i data-lucide="chevron-left"></i></button>
                    <h2 class="text-xl font-black uppercase text-game-success">Nova Missão</h2>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="blitz-ean" class="flex-1 bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-center text-game-success text-lg" placeholder="SCAN EAN">
                    <button onclick="dispararScannerGenerico('blitz-ean')" class="bg-game-success text-slate-950 px-4 rounded-xl"><i data-lucide="camera"></i></button>
                </div>
                <button onclick="checkBlitzProduto()" class="w-full bg-game-success text-slate-950 p-4 rounded-xl font-black uppercase">VERIFICAR NUVEM</button>
            </div>

            <!-- Step Cad: Novo Produto -->
            <div id="blitz-step-cad" class="blitz-step glass p-8 rounded-[2rem] border-t-8 border-game-warning space-y-4">
                <h2 class="text-lg font-black text-game-warning uppercase italic text-center">Produto Desconhecido</h2>
                <input type="text" id="blitz-cad-nome" placeholder="NOME DO ITEM" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl uppercase">
                <select id="blitz-cad-cat" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl uppercase">
                    <option value="Mercearia">🛒 Mercearia</option><option value="Bebidas">🥤 Bebidas</option><option value="Perfumaria">🧴 Perfumaria</option><option value="Limpeza">🧹 Limpeza</option><option value="Alho">🧄 Alho</option><option value="Bazar">🏠 Bazar</option>
                </select>
                <button onclick="salvarNovoProdutoBlitz()" class="w-full bg-game-warning text-slate-950 p-4 rounded-xl font-black uppercase">CADASTRAR E SEGUIR</button>
            </div>

            <!-- Step Datas: Quantidade de Lotes -->
            <div id="blitz-step-datas" class="blitz-step glass p-10 rounded-[2rem] border-t-8 border-game-accent text-center space-y-5">
                <h2 class="text-lg font-black text-game-accent uppercase italic">Quantos lotes existem?</h2>
                <input type="number" id="blitz-qtd-datas" value="1" min="1" class="w-24 bg-slate-950 border-2 border-game-accent p-4 rounded-2xl text-3xl font-black text-center text-game-accent">
                <button onclick="definirLotesBlitz()" class="w-full bg-game-accent text-white p-4 rounded-xl font-black uppercase">CONFIGURAR</button>
            </div>

            <!-- Step Set-Dates: Calendário -->
            <div id="blitz-step-set-dates" class="blitz-step glass p-6 rounded-[2rem] border-t-8 border-game-cyan space-y-4">
                <h2 class="text-lg font-black uppercase text-center text-game-cyan">Definir Validades</h2>
                <div id="blitz-dates-inputs" class="space-y-3"></div>
                <button onclick="startContagemSetores()" class="w-full bg-game-cyan text-slate-950 p-4 rounded-xl font-black uppercase">INICIAR COLETA</button>
            </div>

            <!-- Step Sector: Contagem -->
            <div id="blitz-step-sector" class="blitz-step glass p-5 rounded-[2rem] border-t-8 border-game-success space-y-5">
                <div class="flex justify-between items-start">
                    <div>
                        <span id="blitz-sector-badge" class="text-[8px] font-black bg-game-success/20 text-game-success px-2 py-1 rounded-full uppercase">---</span>
                        <h2 id="blitz-sector-name" class="text-xl font-black uppercase text-white italic mt-1 leading-none">---</h2>
                    </div>
                    <div class="text-right">
                        <p id="blitz-sector-val" class="text-sm font-black text-game-cyan">--/--/--</p>
                    </div>
                </div>
                <div class="space-y-4">
                    <input type="text" id="blitz-inp-soltas" placeholder="UN SOLTAS" oninput="formatarInputMoeda(this)" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl text-3xl text-center text-white">
                    <div class="p-3 bg-slate-900/50 rounded-xl border border-slate-800 grid grid-cols-2 gap-2">
                        <input type="text" id="blitz-inp-f-qtd" placeholder="FARDOS" oninput="formatarInputMoeda(this)" class="bg-slate-950 border border-slate-800 p-3 rounded-lg text-center text-xs">
                        <input type="text" id="blitz-inp-f-un" placeholder="UN/F" oninput="formatarInputMoeda(this)" class="bg-slate-950 border border-slate-800 p-3 rounded-lg text-center text-xs">
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="voltarSetorBlitz()" class="flex-1 bg-slate-800 text-slate-500 p-4 rounded-xl uppercase text-[10px]">Voltar</button>
                    <button onclick="pausarBlitzCloud()" class="flex-1 bg-slate-900 text-game-warning p-4 rounded-xl uppercase text-[10px] border border-game-warning/30">Pausar</button>
                    <button onclick="confirmarSetorBlitz()" class="flex-[2] bg-game-success text-slate-950 p-4 rounded-xl font-black uppercase">Confirmar</button>
                </div>
            </div>

            <!-- Step Final: Resumo -->
            <div id="blitz-step-final" class="blitz-step glass p-8 rounded-[3rem] border-t-8 border-game-accent space-y-6 text-center">
                 <h2 class="text-xl font-black uppercase italic">Blitz Finalizada</h2>
                 <div id="blitz-resumo-corpo" class="space-y-2 max-h-64 overflow-y-auto no-scrollbar text-left"></div>
                 <button onclick="concluirBlitzMatrix()" class="w-full bg-game-accent text-white p-4 rounded-xl font-black uppercase shadow-xl">SINCRONIZAR COM MATRIX</button>
            </div>
        </section>

        <!-- MATRIX DE DADOS (CONSULTA) -->
        <section id="view-consulta" class="hidden space-y-4">
            <div class="glass p-3 rounded-2xl flex items-center justify-between">
                <button onclick="voltarParaBase()" class="p-2 bg-slate-800 rounded-xl"><i data-lucide="chevron-left"></i></button>
                <h1 class="text-xl font-black uppercase italic">Matrix de Dados</h1>
                <div class="w-10"></div>
            </div>
            <div id="container-consulta" class="space-y-4 pb-10"></div>
        </section>
    </main>

    <!-- Scanner Modal -->
    <div id="modal-scanner-generico" class="hidden fixed inset-0 z-[2000] bg-black flex flex-col">
        <div id="reader-generico" class="flex-1"></div>
        <button onclick="fecharScannerGenerico()" class="bg-game-danger p-6 text-white font-black uppercase">Fechar Câmera</button>
    </div>

    <!-- Notificações -->
    <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-[5000] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const SUPABASE_URL = 'https://zwtvekbsfzjrsnisireg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_5i19XNHPnnVVH5Vrqfj52g_hlyrNWo2';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let db = { produtos: [] };
        let blitzState = { ean: '', prod: null, lotes: [], currentSectorIdx: 0, currentLoteIdx: 0, answers: {} };
        const SETORES = [{id:'prat', nome:'Prateleira'}, {id:'gel', nome:'Geladeira'}, {id:'orel', nome:'Orelhas'}, {id:'ilha', nome:'Ilhas'}, {id:'ponta', nome:'Ponta'}, {id:'dep', nome:'Depósito'}];

        document.addEventListener('DOMContentLoaded', () => { 
            lucide.createIcons(); 
            verificarSessao(); 
            atualizarDashboard(); 
            checkCloudDrafts();
        });

        // --- CORE FUNCTIONS ---
        async function atualizarDashboard() {
            const { data } = await supabaseClient.from('produtos').select('*, validades(*)');
            db.produtos = data || [];
            const agora = new Date(); const limite = new Date(); limite.setDate(agora.getDate() + 7);
            let v = 0;
            db.produtos.forEach(p => p.validades.forEach(val => { if(new Date(val.data + 'T00:00:00') <= limite) v++; }));
            document.getElementById('dash-total').innerText = db.produtos.length;
            document.getElementById('dash-vencidos').innerText = v;
        }

        function navigate(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`view-${id}`).classList.remove('hidden');
            if(id === 'consulta') renderizarConsulta();
            lucide.createIcons();
        }

        function voltarParaBase() { navigate('dashboard'); checkCloudDrafts(); }

        // --- CLOUD SYNC LOGIC ---
        async function saveDraftToCloud() {
            document.getElementById('cloud-status').innerText = "SINCRONIZANDO...";
            const { error } = await supabaseClient.from('blitz_drafts').upsert({
                ean: blitzState.ean,
                prod: blitzState.prod,
                lotes: blitzState.lotes,
                answers: blitzState.answers,
                current_lote_idx: blitzState.currentLoteIdx,
                current_sector_idx: blitzState.currentSectorIdx
            });
            if(!error) document.getElementById('cloud-status').innerText = "NUVEM ATUALIZADA";
        }

        async function checkCloudDrafts() {
            const { data } = await supabaseClient.from('blitz_drafts').select('*').order('updated_at', { ascending: false }).limit(1).single();
            if(data) {
                document.getElementById('cloud-draft-name').innerText = data.prod.nome;
                document.getElementById('cloud-draft-alert').classList.remove('hidden');
                localStorage.setItem('alns_last_cloud_ean', data.ean);
            } else {
                document.getElementById('cloud-draft-alert').classList.add('hidden');
            }
        }

        async function resgatarBlitzNuvem() {
            const ean = localStorage.getItem('alns_last_cloud_ean');
            const { data } = await supabaseClient.from('blitz_drafts').select('*').eq('ean', ean).single();
            if(data) {
                blitzState = { 
                    ean: data.ean, prod: data.prod, lotes: data.lotes, 
                    answers: data.answers, currentLoteIdx: data.current_lote_idx, 
                    currentSectorIdx: data.current_sector_idx 
                };
                navigate('blitz-flow');
                abrirSetorBlitz();
            }
        }

        async function pausarBlitzCloud() {
            await saveDraftToCloud();
            showToast('SALVO NA NUVEM', 'warning');
            voltarParaBase();
        }

        // --- BLITZ FLOW ---
        async function checkBlitzProduto() {
            const ean = document.getElementById('blitz-ean').value;
            if(!ean) return;
            
            // Verifica se já existe rascunho na nuvem para este EAN específico
            const { data: cloudDraft } = await supabaseClient.from('blitz_drafts').select('*').eq('ean', ean).single();
            
            if(cloudDraft) {
                if(confirm("Rascunho encontrado na nuvem para este item. Deseja continuar?")) {
                    blitzState = { ean: cloudDraft.ean, prod: cloudDraft.prod, lotes: cloudDraft.lotes, answers: cloudDraft.answers, currentLoteIdx: cloudDraft.current_lote_idx, currentSectorIdx: cloudDraft.current_sector_idx };
                    abrirSetorBlitz();
                    return;
                }
            }

            blitzState.ean = ean;
            const { data: p } = await supabaseClient.from('produtos').select('*').eq('ean', ean).single();
            document.querySelectorAll('.blitz-step').forEach(s => s.classList.remove('active'));
            if(!p) {
                document.getElementById('blitz-step-cad').classList.add('active');
            } else { 
                blitzState.prod = p; 
                document.getElementById('blitz-step-datas').classList.add('active'); 
            }
        }

        function definirLotesBlitz() {
            const qtd = parseInt(document.getElementById('blitz-qtd-datas').value) || 1;
            const container = document.getElementById('blitz-dates-inputs');
            container.innerHTML = '';
            for(let i=0; i<qtd; i++) container.innerHTML += `<input type="date" class="blitz-date-field w-full bg-slate-950 border border-slate-800 p-4 rounded-xl outline-none font-bold text-white mb-2">`;
            document.querySelectorAll('.blitz-step').forEach(s => s.classList.remove('active'));
            document.getElementById('blitz-step-set-dates').classList.add('active');
        }

        function startContagemSetores() {
            const dates = Array.from(document.querySelectorAll('.blitz-date-field')).map(i => i.value);
            if(dates.some(d => !d)) return showToast('Defina as datas', 'danger');
            blitzState.lotes = dates;
            blitzState.currentLoteIdx = 0; blitzState.currentSectorIdx = 0; blitzState.answers = {};
            saveDraftToCloud(); // Primeiro save na nuvem com a estrutura pronta
            abrirSetorBlitz();
        }

        function abrirSetorBlitz() {
            const s = SETORES[blitzState.currentSectorIdx];
            const l = blitzState.lotes[blitzState.currentLoteIdx];
            document.querySelectorAll('.blitz-step').forEach(step => step.classList.remove('active'));
            document.getElementById('blitz-step-sector').classList.add('active');
            document.getElementById('blitz-sector-badge').innerText = `LOTE ${blitzState.currentLoteIdx+1}/${blitzState.lotes.length}`;
            document.getElementById('blitz-sector-name').innerText = s.nome;
            document.getElementById('blitz-sector-val').innerText = l.split('-').reverse().join('/');
            ['soltas','f-qtd','f-un'].forEach(id => document.getElementById(`blitz-inp-${id}`).value = '');
        }

        async function confirmarSetorBlitz() {
            const un = uNum(document.getElementById('blitz-inp-soltas').value);
            const fq = uNum(document.getElementById('blitz-inp-f-qtd').value);
            const fu = uNum(document.getElementById('blitz-inp-f-un').value);
            const tot = un + (fq * fu);
            const date = blitzState.lotes[blitzState.currentLoteIdx];
            
            if(!blitzState.answers[date]) blitzState.answers[date] = {};
            blitzState.answers[date][SETORES[blitzState.currentSectorIdx].id] = tot;
            
            // Sync nuvem a cada confirmação de setor
            await saveDraftToCloud();

            blitzState.currentSectorIdx++;
            if(blitzState.currentSectorIdx >= SETORES.length) { blitzState.currentSectorIdx = 0; blitzState.currentLoteIdx++; }
            
            if(blitzState.currentLoteIdx >= blitzState.lotes.length) renderizarResumoBlitz();
            else abrirSetorBlitz();
        }

        async function concluirBlitzMatrix() {
            const ean = blitzState.ean;
            for (const d of Object.keys(blitzState.answers)) {
                let tot = 0; SETORES.forEach(s => tot += blitzState.answers[d][s.id] || 0);
                const { data: vEx } = await supabaseClient.from('validades').select('*').eq('produto_ean', ean).eq('data', d).single();
                if(vEx) await supabaseClient.from('validades').update({ qtd: tot }).eq('id', vEx.id);
                else await supabaseClient.from('validades').insert({ produto_ean: ean, data: d, qtd: tot });
            }
            // Limpa a nuvem após concluir
            await supabaseClient.from('blitz_drafts').delete().eq('ean', blitzState.ean);
            showToast('SINCRONIZADO COM MATRIX');
            await atualizarDashboard();
            voltarParaBase();
        }

        // --- UTILIDADES ---
        function fNum(n) { return new Intl.NumberFormat('pt-BR').format(n || 0); }
        function uNum(s) { return parseInt(s.toString().replace(/\./g, '')) || 0; }
        function formatarInputMoeda(i) {
            let v = i.value.replace(/\D/g, '');
            i.value = v ? new Intl.NumberFormat('pt-BR').format(parseInt(v)) : '';
        }
        function showToast(m, type='success') {
            const t = document.createElement('div');
            t.className = `p-4 rounded-xl border-2 ${type==='success'?'border-game-cyan':'border-game-warning'} bg-game-card text-white font-black uppercase text-[10px] animate-bounce shadow-2xl`;
            t.innerText = m;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }
        function realizarLogin(e) { e.preventDefault(); if(document.getElementById('login-senha').value.toLowerCase() === 'alns') { sessionStorage.setItem('alns_logado', 'true'); document.getElementById('view-login').classList.add('hidden'); } }
        function verificarSessao() { if (sessionStorage.getItem('alns_logado') === 'true') document.getElementById('view-login').classList.add('hidden'); }
        function realizarLogout() { sessionStorage.removeItem('alns_logado'); location.reload(); }
        
        function dispararScannerGenerico(id) {
            document.getElementById('modal-scanner-generico').classList.remove('hidden');
            html5QrCodeGenerico = new Html5Qrcode("reader-generico");
            html5QrCodeGenerico.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (text) => {
                fecharScannerGenerico();
                document.getElementById(id).value = text;
            }, () => {});
        }
        function fecharScannerGenerico() { if(html5QrCodeGenerico) html5QrCodeGenerico.stop().then(() => { document.getElementById('modal-scanner-generico').classList.add('hidden'); }); }
        
        function renderizarConsulta() {
            const container = document.getElementById('container-consulta');
            container.innerHTML = '';
            db.produtos.forEach(p => {
                const tot = p.validades.reduce((acc,v)=>acc+v.qtd, 0);
                container.innerHTML += `<div class="glass p-4 rounded-2xl flex justify-between items-center"><div><h4 class="font-black uppercase">${p.nome}</h4><p class="text-[9px] text-slate-500">${p.ean}</p></div><span class="text-game-cyan font-black">${tot}</span></div>`;
            });
        }
